name: Feature request
description: Suggest an idea for OpenCode Go Conversation
title: "[Feature]: "
labels: [enhancement]
body:
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I searched existing feature requests first.
          required: true
  - type: textarea
    attributes:
      label: Problem
      description: What are you trying to do that the integration does not support?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.
  - type: textarea
    attributes:
      label: Additional context
      description: Links to OpenCode Go documentation, screenshots, related issues.
